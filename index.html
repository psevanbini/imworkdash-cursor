<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ParentSquare — IM Workload Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/brand.css">
  <link rel="stylesheet" href="shared/shell.css">
</head>
<body class="shell">
  <a class="skip-link" href="#dashboard-main">Skip to dashboard content</a>

  <header class="chrome" role="banner">
    <div class="chrome-brand">
      <img src="logo.png" alt="ParentSquare Logo" />
      <div>
        <h1 class="chrome-title">Implementation Manager Dashboard</h1>
        <p id="chrome-sub" class="chrome-sub">My Workload &amp; Assignments</p>
      </div>
    </div>
    <div class="chrome-controls">
      <label for="dashboard-role">Role view</label>
      <select id="dashboard-role" name="dashboard-role" aria-describedby="role-hint">
        <option value="ic">Individual Contributor</option>
        <option value="lead">Team Lead</option>
        <option value="manager">Manager</option>
      </select>
    </div>
    <p id="role-hint" class="sr-only">
      Switches between the individual contributor, team lead, and manager dashboard layouts.
    </p>
  </header>

  <div id="role-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <main id="dashboard-main" class="frame-wrap" role="main" aria-label="Dashboard content for selected role">
    <iframe
      id="frame-ic"
      class="is-active"
      title="Individual Contributor — My Workload"
      data-src="ic.html?embed=1"
    ></iframe>
    <iframe
      id="frame-lead"
      title="Team Lead — Territory Overview"
      data-src="LeadView.html?embed=1"
    ></iframe>
    <iframe
      id="frame-manager"
      title="Manager — Total Team Workload"
      data-src="ManagerView.html?embed=1"
    ></iframe>
  </main>

  <script>
    (function () {
      const select = document.getElementById("dashboard-role");
      const subtitle = document.getElementById("chrome-sub");
      const announce = document.getElementById("role-announcement");
      const frames = {
        ic: document.getElementById("frame-ic"),
        lead: document.getElementById("frame-lead"),
        manager: document.getElementById("frame-manager"),
      };
      const meta = {
        ic: {
          subtitle: "My Workload & Assignments",
          announce: "Showing Individual Contributor view — My Workload.",
        },
        lead: {
          subtitle: "EST Regional Workload",
          announce: "Showing Team Lead view — Implementation Team Lead Dashboard.",
        },
        manager: {
          subtitle: "Total Team Workload",
          announce: "Showing Manager view — Total Team Workload.",
        },
      };

      var activeKey = null;
      var dirtyFrames = { ic: false, lead: false, manager: false };
      var SYNC_MSG = { type: "imworkdash-team-updated" };

      function ensureFrameSrc(el) {
        if (!el.getAttribute("src")) {
          el.setAttribute("src", el.getAttribute("data-src"));
        }
      }

      function preloadFrames() {
        Object.keys(frames).forEach(function (k) {
          ensureFrameSrc(frames[k]);
        });
      }

      function activate(key) {
        if (!frames[key] || key === activeKey) return;
        activeKey = key;
        Object.keys(frames).forEach(function (k) {
          const el = frames[k];
          ensureFrameSrc(el);
          el.classList.toggle("is-active", k === key);
        });
        const info = meta[key];
        if (info) {
          subtitle.textContent = info.subtitle;
          announce.textContent = info.announce;
        }
        if (select.value !== key) {
          select.value = key;
        }
        if (location.hash !== "#" + key) {
          history.replaceState(null, "", "#" + key);
        }
        if (dirtyFrames[key]) {
          dirtyFrames[key] = false;
          var frame = frames[key];
          if (frame && frame.contentWindow) {
            try {
              frame.contentWindow.postMessage(SYNC_MSG, "*");
            } catch (err) { /* unloaded */ }
          }
        }
      }

      function keyFromHash() {
        const hash = (location.hash || "").replace(/^#/, "");
        return frames[hash] ? hash : null;
      }

      select.addEventListener("change", function () {
        requestAnimationFrame(function () {
          activate(select.value);
        });
      });

      window.addEventListener("hashchange", function () {
        const key = keyFromHash();
        if (key) activate(key);
      });

      const initial = keyFromHash() || select.value;
      select.value = initial;
      activate(initial);
      requestAnimationFrame(preloadFrames);

      window.addEventListener("message", function (e) {
        if (!e.data || e.data.type !== "imworkdash-team-updated") return;
        Object.keys(frames).forEach(function (key) {
          var frame = frames[key];
          if (!frame || !frame.contentWindow) return;
          if (e.source === frame.contentWindow) return;
          if (key === activeKey) {
            try {
              frame.contentWindow.postMessage(SYNC_MSG, "*");
            } catch (err) { /* cross-origin or unloaded */ }
          } else {
            dirtyFrames[key] = true;
          }
        });
      });
    })();
  </script>
</body>
</html>
